[package]
# Integration tests share ONE executable (tests/integration.rs, see its header).
autotests = false
name = "vector-magic-rebuild"
version = "0.5.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
description = "Offline raster-to-SVG reconstruction with compact shared curves"
default-run = "vector-magic-rebuild"

[features]
# The SVG renderer alone: the Auto simplify tolerance compares renderings,
# and the browser build (kit/web) needs it without the window.
render = ["dep:resvg"]
# The app's window code without a window: the desktop runs it with eframe,
# the browser build (kit/web) with a canvas.
ui = ["render", "dep:egui", "licence"]
desktop = ["ui", "dep:eframe", "dep:ureq"]
# The commercial licence's certificate check (licence.rs): Ed25519 over
# base64url JSON, as Connections Pay signs it.
licence = ["dep:ed25519-dalek", "dep:sha2"]
ui-test = ["desktop"]
profile = ["vector-rebuild/profile"]

[[bin]]
name = "vector-magic-rebuild"
path = "src/main.rs"

[[bin]]
name = "vector-magic-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "vector-magic-preview"
path = "src/preview_main.rs"
required-features = ["desktop"]

[dependencies]
vector-rebuild = { path = "../rust" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "pnm", "tiff", "tga"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"], optional = true }
resvg = { version = "=0.48.1", default-features = false, optional = true }
# PDF streams (pdf_eps.rs); already in the build through image's PNG codec.
miniz_oxide = "=0.8.9"
# The licence (licence.rs): the same crates SageThumbs 2K verifies Pay's
# certificates with, and in the window the one HTTPS call that redeems a key.
ed25519-dalek = { version = "3", default-features = false, optional = true }
# Also the engine's MCP server (src/mcp.rs): JSON-RPC, and its PNG previews.
base64 = "0.23"
serde_json = "1"
sha2 = { version = "0.11", optional = true }
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
# On Linux the window needs a display server's backend, and eframe is built
# without its defaults: the Linux build adds `--features
# eframe/x11,eframe/wayland` (publish/release.py). They are not declared here,
# because Cargo locks every package a declared feature could reach (wgpu among
# them) and this repository's builds stay offline.

[[example]]
name = "render_svg"
required-features = ["desktop"]

[[test]]
name = "integration"
path = "tests/integration.rs"
