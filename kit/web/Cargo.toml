[package]
name = "vectormagik-web"
version = "0.4.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "VectorMagik in the browser: the desktop app as WebAssembly, drawn on a canvas"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
vector-magic-rebuild = { path = "../app", default-features = false, features = ["ui"] }
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
